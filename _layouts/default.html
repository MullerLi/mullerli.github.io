<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "zh-TW" }}" data-header-transparent="{{ header_transparent | default: site.header_transparent | default: true }}">

  {%- include head.html -%}

  <body>

    {%- include views/header.html -%}

    {%- include views/banner.html -%}

    {%- include extensions/hashlocate.html -%}

    

    {%- include extensions/click-to-top.html -%}

    <main class="page-content emfont-GenRyuMinTW" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include views/footer.html -%}

<div id="search-overlay" class="search-overlay hidden" aria-hidden="true">
  <div class="search-panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
    <div class="search-header">
      <input id="search-input" type="search" placeholder="搜尋文章與頁面…" autocomplete="off" />
      <button id="search-close" aria-label="關閉">×</button>
    </div>
    <div id="search-results" class="search-results" role="listbox" aria-live="polite"></div>
  </div>
</div>
