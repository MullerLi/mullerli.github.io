name: Replace speaker media photo

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/replace-speaker-media.yml'

permissions:
  contents: write

jobs:
  replace-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download original uploaded JPEG without recompression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/rice-lecture
          curl --fail --location --retry 3 'https://at.adobe.com/0dhjd02zz9J0cxhk' -o assets/images/rice-lecture/speaker-media.jpg
          test "$(stat -c%s assets/images/rice-lecture/speaker-media.jpg)" -eq 254481
          file assets/images/rice-lecture/speaker-media.jpg
          stat -c '%n %s bytes' assets/images/rice-lecture/speaker-media.jpg

      - name: Commit exact original image bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/replace-speaker-media.yml
          git add assets/images/rice-lecture/speaker-media.jpg
          git commit -m 'Replace speaker media photo with original-resolution upload'
          git push origin master
