name: Patch rice lecture profile publications

on:
  push:
    paths:
      - '.github/workflows/patch-rice-lecture-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add recent publications and profile link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rice-lecture/index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = '    .media-note{margin-top:38px;max-width:700px;padding-left:24px;border-left:8px solid var(--mint);font-size:15px;color:var(--muted)}\n'
          css_insert = css_anchor + '''    .profile-links{margin-top:24px;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.02em}\n    .profile-links a{text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:3px}\n    .recent-pubs{margin-top:42px;padding-top:22px;border-top:1px solid var(--ink);max-width:760px}\n    .recent-pubs-title{margin-bottom:14px;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mint)}\n    .recent-pubs ol{margin:0;padding-left:1.25em}\n    .recent-pubs li{margin:0 0 13px;padding-left:6px;font-size:14px;line-height:1.7;color:var(--muted)}\n    .recent-pubs li:last-child{margin-bottom:0}\n    .recent-pubs a{color:var(--ink)}\n'''
          if css_anchor not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_anchor, css_insert, 1)

          html_anchor = '''        <div class="media-note">臺大 CASE 報科學於「百年稻浪—稻米品質及米飯品評」講座前進行人物專訪，介紹稻米育種、米質研究與米飯品評工作。 <a href="https://case.ntu.edu.tw/blog/?p=46621" target="_blank" rel="noopener">閱讀專訪</a></div>'''
          html_insert = html_anchor + '''\n        <div class="profile-links"><a href="/about.html">個人介紹與完整發表列表 →</a></div>\n        <div class="recent-pubs">\n          <div class="recent-pubs-title">近年發表 · SELECTED PUBLICATIONS</div>\n          <ol>\n            <li>Hsieh, C.-Y., Kordrostami, M., Chen, H., Wu, Y.-C., Teng, C.-Y., &amp; Li, C.-H. (2025). Study of the rice yield variations under water saving scenarios using DSSAT crop model. <i>PLOS ONE</i>, 20(8), e0329509. <a href="https://doi.org/10.1371/journal.pone.0329509" target="_blank" rel="noopener">DOI</a></li>\n            <li>Chen, H., Wu, Y. C., Teng, C. Y., &amp; Li, C. H. (2025). A century-long monitoring of rice plant height during growth period in central Taiwan. <i>Scientific Data</i>, 12(1), 740. <a href="https://doi.org/10.1038/s41597-025-0740-x" target="_blank" rel="noopener">DOI</a></li>\n            <li>Chen, H. Y., Wu, Y. C., Teng, C. Y., &amp; Li, C. H. (2025). Effects of climate warming on rice spikelet fertility in central Taiwan. <i>Journal of Agriculture and Forestry</i>, 72, 1–11. <a href="https://doi.org/10.30089/JAF.202503_72(1).0001" target="_blank" rel="noopener">DOI</a></li>\n            <li>Teng, C. Y., Li, C. H., Wu, Y. C., Yang, C. L., &amp; Hsu, C. S. (2024). Studies on resource-conserving agronomic crop production II: Trait performance of rice suitable for single summer cropping. <i>Research Bulletin of Taichung District Agricultural Research and Extension Station</i>, 165, 1–34. <a href="https://www.tcdares.gov.tw/files/tdais/web_structure/13373/A01_1.pdf" target="_blank" rel="noopener">全文</a></li>\n          </ol>\n        </div>'''
          if html_anchor not in text:
              raise SystemExit('Profile anchor not found')
          text = text.replace(html_anchor, html_insert, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "Levi, CHL"
          git config user.email "30871098+MullerLi@users.noreply.github.com"
          git add rice-lecture/index.html
          git rm .github/workflows/patch-rice-lecture-profile.yml
          git commit -m "Add recent publications to lecture profile"
          git push origin master
