<h1>搜尋文章</h1>

<div class="search-container">
  <input type="text" id="search-page-input" placeholder="輸入關鍵字…" autocomplete="off">
  <!-- 下拉結果清單 -->
  <ul id="search-page-results"></ul>
</div>

<style>
.search-container {
  position: relative;
  max-width: 600px;
  margin: 20px 0;
}

#search-input {
  width: 100%;
  padding: 12px 16px;
  font-size: 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  outline: none;
  transition: border-color 0.3s;
}

#search-input:focus {
  border-color: #007bff;
}

#search-results {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  max-height: 400px;
  overflow-y: auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  z-index: 1000;
  list-style: none;
  padding: 0;
  margin: 0;
}

.search-result {
  border-bottom: 1px solid #eee;
}

.search-result:last-child {
  border-bottom: none;
}

.search-result a {
  display: block;
  padding: 15px;
  text-decoration: none;
  color: inherit;
  transition: background-color 0.2s;
}

.search-result a:hover {
  background-color: #f8f9fa;
}

.search-result h3 {
  margin: 0 0 5px 0;
  font-size: 16px;
  color: #007bff;
}

.search-result p {
  margin: 0;
  color: #666;
  font-size: 14px;
  line-height: 1.4;
}

.no-results, .error {
  padding: 15px;
  text-align: center;
  color: #666;
  font-style: italic;
}

.error {
  color: #dc3545;
}

@media (max-width: 768px) {
  .search-container {
    max-width: 100%;
  }
  
  #search-input {
    font-size: 16px; /* 防止 iOS 縮放 */
  }
}
</style>
